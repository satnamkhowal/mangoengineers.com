name: PHP Architecture Check

on:
  push:
    branches:
      - refactor/php-common-layout
      - refactor/php-page-bodies
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        run: |
          find . -maxdepth 2 -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Verify full PHP conversion
        run: |
          if find . -maxdepth 1 -type f -name '*.html' -print -quit | grep -q .; then
            echo "Root HTML source files still exist."
            find . -maxdepth 1 -type f -name '*.html' -print
            exit 1
          fi

          php -r '
            require "includes/site-config.php";
            require "includes/page-config.php";
            $defs = mango_page_definitions();
            $missing = [];
            foreach (array_keys($defs) as $key) {
                if (!is_file($key . ".php")) {
                    $missing[] = $key . ".php";
                }
                if (!is_file("pages/" . $key . ".php")) {
                    $missing[] = "pages/" . $key . ".php";
                }
            }
            foreach (["blog", "index-one"] as $redirectKey) {
                if (!is_file($redirectKey . ".php")) {
                    $missing[] = $redirectKey . ".php";
                }
            }
            if ($missing) {
                fwrite(STDERR, "Missing PHP files: " . implode(", ", $missing) . PHP_EOL);
                exit(1);
            }
            if (count($defs) !== 64) {
                fwrite(STDERR, "Unexpected page metadata count: " . count($defs) . PHP_EOL);
                exit(1);
            }
            echo "Full PHP conversion verified for " . count($defs) . " configured pages plus 2 redirects." . PHP_EOL;
          '

      - name: Verify shared includes and rewrites
        run: |
          test -f includes/head.php
          test -f includes/header.php
          test -f includes/footer.php
          test -f includes/site-config.php
          test -f includes/page-config.php
          test -f includes/legacy-renderer.php
          grep -Fq 'RewriteRule ^([A-Za-z0-9-]+)\.html$ $1.php [L,QSA]' .htaccess
