name: Replace Mango Engineers phone number and create JPG copies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-phone-and-jpg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-dejavu-core fonts-liberation

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pytesseract numpy

      - name: Replace phone number and create JPG folder
        run: |
          python .github/scripts/replace_phone_and_make_jpg.py

      - name: Show processing report
        run: |
          cat "assests/Mango engineers images/phone-replacement-report.txt"

      - name: Commit generated image updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assests/Mango engineers images"
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Replace Mango Engineers contact number and add JPG copies"
            git pull --rebase origin main
            git push origin main
          fi
